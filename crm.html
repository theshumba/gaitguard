// ========== RENDER: QUALIFIED LEADS ==========
function renderQualifiedLeads() {
  const container = document.getElementById('qualified-leads-content');
  const qualified = state.leads.filter(l => l.status === 'qualified' || l.status === 'crm');
  const unqualified = state.leads.filter(l => l.status === 'unqualified');
  const hasUnqual = unqualified.length > 0;

  let html = `
    <div class="section-header">
      <h1>Qualified Leads</h1>
    </div>
  `;

  html += `<div class="qual-layout${hasUnqual ? '' : ' full-width'}">`;

  // Qualified grid
  html += '<div>';
  if (qualified.length === 0) {
    html += `
      <div class="empty-state">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="60" cy="60" r="40" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M45 60 L55 70 L75 50" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3>No qualified leads yet</h3>
        <p>Qualify leads from the Lead Bank to see them here.</p>
      </div>
    `;
  } else {
    // Default sort qualified leads by opportunity score descending
    qualified.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a));
    html += '<div class="lead-grid">';
    qualified.forEach(l => {
      const q = l.qualification || {};
      const score = getQualificationScore(l);
      const sb = STATUS_BADGES[l.status];
      html += `
        <div class="card lead-card">
          <div class="lead-card-header">
            <div>
              <div class="lead-card-name">${escapeHtml(l.businessName)}</div>
              ${l.industry ? `<span class="badge badge-neutral">${escapeHtml(l.industry)}</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:var(--space-2);">
              ${renderScoreBadge(l)}
              <span class="badge ${sb.cls}">${sb.label}</span>
            </div>
          </div>
          <div class="service-tags">
            <span class="service-tag ${q.yardOperation?.trim() ? 'filled' : 'empty'}">Yard & Operation ${q.yardOperation?.trim() ? '&#10003;' : ''}</span>
            <span class="service-tag ${q.painPoint?.trim() ? 'filled' : 'empty'}">Pain Point ${q.painPoint?.trim() ? '&#10003;' : ''}</span>
            <span class="service-tag ${q.budgetSignal?.trim() ? 'filled' : 'empty'}">Budget Signal ${q.budgetSignal?.trim() ? '&#10003;' : ''}</span>
          </div>
          ${q.decisionMaker ? `<p class="lead-card-desc" style="-webkit-line-clamp:1;">${escapeHtml(q.decisionMaker)}</p>` : ''}
          <div class="lead-card-meta">
            <span>${formatDate(q.dateQualified || l.dateAdded)}</span>
          </div>
          ${renderAttribution(l)}
          ${renderLastActivity(l)}
          <div class="lead-card-actions">
            <button class="btn btn-ghost btn-sm" data-action="view-qual" data-id="${l.id}"><i data-lucide="eye" aria-hidden="true"></i> View Full</button>
            ${l.status === 'qualified' ? `<button class="btn btn-primary btn-sm" data-action="move-to-crm" data-id="${l.id}"><i data-lucide="arrow-right" aria-hidden="true"></i> Move to CRM</button>` : ''}
          </div>
        </div>
      `;
    });
    html += '</div>';
  }
  html += '</div>';

  // Unqualified sidebar
  if (hasUnqual) {
    html += `
      <div class="qual-sidebar">
        <div class="qual-sidebar-title">Ready to Qualify (${unqualified.length})</div>
        ${unqualified.map(l => `
          <div class="qual-sidebar-item">
            <span>${escapeHtml(l.businessName)}</span>
            <button class="btn btn-primary btn-sm" data-action="qualify" data-id="${l.id}">Qualify Now</button>
          </div>
        `).join('')}
      </div>
    `;
  }
  html += '</div>';

  container.innerHTML = html;
  lucide.createIcons({ nodes: [container] });
}

// ========== RENDER: CRM ==========
function renderCRM() {
  const container = document.getElementById('crm-content');
  const f = state.filters.crm;
  let leads = state.leads.filter(l => l.status === 'crm');
  const totalCount = leads.length;

  if (f.search) {
    const s = f.search.toLowerCase();
    leads = leads.filter(l =>
      l.businessName.toLowerCase().includes(s) ||
      l.contacts.some(c => c.name.toLowerCase().includes(s))
    );
  }
  if (f.stage !== 'all') leads = leads.filter(l => l.crm && l.crm.stage === parseInt(f.stage));
  if (f.priority !== 'all') leads = leads.filter(l => l.crm && l.crm.priority === f.priority);
  if (f.overdueOnly) leads = leads.filter(l => l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) !== null && daysUntil(l.crm.followUpDate) <= 0);
  if (f.today) leads = leads.filter(l => isTodayLead(l));
  if (f.assignedTo !== 'all') leads = leads.filter(l => l.assignedTo === f.assignedTo);

  // Pipeline values across the full CRM cohort (not just filtered)
  const pipeLeads = state.leads.filter(l => l.status === 'crm');
  const pipe = computePipeline(pipeLeads);

  let html = `
    <div class="section-header">
      <h1>CRM / Outreach</h1>
      <div class="view-toggle">
        <button class="view-toggle-btn ${state.crmView === 'list' ? 'active' : ''}" data-action="crm-view" data-view="list" aria-label="List view"><i data-lucide="list" aria-hidden="true"></i> List</button>
        <button class="view-toggle-btn ${state.crmView === 'board' ? 'active' : ''}" data-action="crm-view" data-view="board" aria-label="Board view"><i data-lucide="columns-3" aria-hidden="true"></i> Board</button>
      </div>
    </div>
    <div class="pipeline-bar">
      <div class="pipeline-stat"><span class="pipeline-stat-value">${formatMoney(pipe.total)}</span><span class="pipeline-stat-label">pipeline</span></div>
      <span class="pipeline-sep">&middot;</span>
      <div class="pipeline-stat"><span class="pipeline-stat-value">${formatMoney(pipe.closed)}</span><span class="pipeline-stat-label">closed</span></div>
      <span class="pipeline-sep">&middot;</span>
      <div class="pipeline-stat"><span class="pipeline-stat-value">${formatMoney(pipe.weighted)}</span><span class="pipeline-stat-label">weighted forecast</span></div>
      <div class="pipeline-meta">${pipe.openCount} open &middot; ${pipe.wonCount} won</div>
    </div>
    <div class="filter-bar">
      <input type="text" class="form-input" placeholder="Search by name or contact..." value="${escapeHtml(f.search)}" data-filter="crm-search" aria-label="Search CRM">
      <select class="form-select" data-filter="crm-stage" aria-label="Filter by stage">
        <option value="all"${f.stage==='all'?' selected':''}>All Stages</option>
        ${STAGES.map(s => `<option value="${s.num}"${f.stage==String(s.num)?' selected':''}>${s.name}</option>`).join('')}
      </select>
      <select class="form-select" data-filter="crm-priority" aria-label="Filter by priority">
        <option value="all"${f.priority==='all'?' selected':''}>All Priorities</option>
        <option value="high"${f.priority==='high'?' selected':''}>High</option>
        <option value="medium"${f.priority==='medium'?' selected':''}>Medium</option>
        <option value="low"${f.priority==='low'?' selected':''}>Low</option>
      </select>
      <select class="form-select" data-filter="crm-assigned" aria-label="Filter by assigned consultant">
        <option value="all"${f.assignedTo==='all'?' selected':''}>All Consultants</option>
        ${CONSULTANTS.map(c => `<option value="${c}"${f.assignedTo===c?' selected':''}>${c}</option>`).join('')}
      </select>
      <button class="today-chip${f.today ? ' active' : ''}" data-action="toggle-today-filter" data-scope="crm" aria-pressed="${!!f.today}"><i data-lucide="calendar-clock" aria-hidden="true"></i> Today</button>
      <label class="overdue-check">
        <input type="checkbox" data-filter="crm-overdue" ${f.overdueOnly ? 'checked' : ''}>
        <span>Overdue only</span>
      </label>
      <select class="form-select" data-filter="crm-sort" aria-label="Sort leads">
        <option value="score"${(state.filters.crm.sort||'score')==='score'?' selected':''}>Sort by Score</option>
        <option value="date"${state.filters.crm.sort==='date'?' selected':''}>Sort by Date</option>
        <option value="name"${state.filters.crm.sort==='name'?' selected':''}>Sort by Name</option>
      </select>
      ${isConsultant() ? `<label class="consultant-view-toggle"><input type="checkbox" data-filter="crm-show-all" ${f.assignedTo==='all'?'checked':''}> Show all leads</label>` : ''}
      <span class="count-label">Showing ${leads.length} of ${totalCount}</span>
    </div>
    <div class="bulk-bar${(state.bulkSelection && state.bulkSelection.length) ? ' active' : ''}" id="bulk-bar-crm">
      <span class="bulk-count">${(state.bulkSelection || []).length} selected</span>
      <select class="form-select bulk-action-select" data-action="bulk-action" data-scope="crm" aria-label="Bulk action">
        <option value="">Choose action...</option>
        ${canReassignLeads() ? '<optgroup label="Reassign to">' + CONSULTANTS.map(c => `<option value="reassign:${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') + '</optgroup>' : ''}
        <optgroup label="Move to stage">${STAGES.map(s => `<option value="stage:${s.num}">${s.name}</option>`).join('')}</optgroup>
        <option value="archive">Archive</option>
        <option value="delete">Delete</option>
      </select>
      <button class="btn btn-ghost btn-sm" data-action="bulk-clear">Clear selection</button>
    </div>
  `;

  // Apply sorting (default: by score descending)
  const crmSort = state.filters.crm.sort || 'score';
  if (crmSort === 'score') leads.sort((a, b) => getOpportunityScore(b) - getOpportunityScore(a));
  else if (crmSort === 'name') leads.sort((a, b) => a.businessName.localeCompare(b.businessName));

  if (state.crmView === 'list') {
    html += renderCRMList(leads);
  } else {
    html += renderCRMBoard(leads);
  }

  container.innerHTML = html;
  lucide.createIcons({ nodes: [container] });

  // Kanban drag-and-drop
  if (state.crmView === 'board') initKanbanDrag();
}

function initKanbanDrag() {
  let draggedId = null;
  document.querySelectorAll('.kanban-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      draggedId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(c => c.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.kanban-cards').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.closest('.kanban-column').classList.add('drag-over');
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) {
        col.closest('.kanban-column').classList.remove('drag-over');
      }
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.closest('.kanban-column').classList.remove('drag-over');
      const newStage = parseInt(col.dataset.stage);
      if (draggedId && newStage) {
        const lead = getLeadById(draggedId);
        if (lead && lead.crm) {
          lead.crm.stage = newStage;
          lead.crm.dateLastContact = todayISO;
          addActivity(lead, 'changed stage to ' + getStageName(newStage));
          saveState();
          showToast(`${lead.businessName} moved to ${getStageName(newStage)}`, 'info');
          renderCRM();
          renderSidebarBadges();
        }
      }
      draggedId = null;
    });
  });
}

// ========== EMAIL GENERATION ==========
function getEmailTemplate(lead) {
  const ind = (lead.industry || '').toLowerCase();
  if (/food|beverage|restaurant|bakery|coffee|pizza|chicken|dessert/.test(ind)) return 'restaurant';
  if (/health|clinic|medical|dental|beauty|aesthetics/.test(ind)) return 'healthcare';
  if (/e-commerce|ecommerce|retail|shop|fashion|boutique/.test(ind)) return 'ecommerce';
  if (/professional|law|legal|finance|consulting|agency/.test(ind)) return 'professional';
  if (/tourism|hotel|travel|experience/.test(ind)) return 'tourism';
  return 'general';
}

function getWeaknessNote(lead) {
  if (lead.qualification && lead.qualification.pilotFit) {
    const raw = lead.qualification.pilotFit.trim();
    const firstLine = raw.split('\n')[0].replace(/^[-*\s]+/, '').trim();
    if (firstLine.length > 10) {
      const note = firstLine.endsWith('.') ? firstLine : firstLine + '.';
      return 'I noticed ' + note.charAt(0).toLowerCase() + note.slice(1);
    }
  }
  return 'Right now, the site could do more to convert mobile visitors.';
}

  const pc = getPrimaryContact(lead);

  const templates = {

    },

    },

    },

    }

  };

  // LinkedIn message
  const linkedin = 'Hi ' + contactName + ', I took a look at ' + biz + ' online and had a few ideas on how to improve the customer journey. Would you be open to a quick chat or should I send a few bullet points over?';

function renderMeetings() {

  const weekFromNow = new Date(now.getTime() + 7 * 86400000);

  const upcoming = meetingLeads.filter(l => l.crm.meetingDate && new Date(l.crm.meetingDate) >= now);
  const upcomingWeek = upcoming.filter(l => new Date(l.crm.meetingDate) <= weekFromNow);
  const completed = meetingLeads.filter(l => l.crm.stage >= 4 || (l.crm.meetingDate && new Date(l.crm.meetingDate) < now));
  const totalBooked = meetingLeads.length;

  let html = `
    <div class="section-header">
      <h1>Meetings</h1>
      <div class="view-toggle">
        <button class="view-toggle-btn ${state.meetingsView === 'list' ? 'active' : ''}" data-action="meetings-view" data-view="list" aria-label="List view"><i data-lucide="list" aria-hidden="true"></i> List</button>
        <button class="view-toggle-btn ${state.meetingsView === 'calendar' ? 'active' : ''}" data-action="meetings-view" data-view="calendar" aria-label="Calendar view"><i data-lucide="calendar" aria-hidden="true"></i> Calendar</button>

      <div class="stat-chip teal"><span>Upcoming (7 days):</span><span class="stat-value">${upcomingWeek.length}</span></div>
      <div class="stat-chip green"><span>Completed:</span><span class="stat-value">${completed.length}</span></div>
    </div>
  `;

  if (totalBooked === 0) {
    html += `
      <div class="empty-state">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="20" y="20" width="80" height="80" rx="8" stroke="currentColor" stroke-width="2" fill="none"/>
          <line x1="20" y1="40" x2="100" y2="40" stroke="currentColor" stroke-width="2"/>
          <line x1="45" y1="12" x2="45" y2="28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="75" y1="12" x2="75" y2="28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="35" y="52" width="12" height="12" rx="2" stroke="currentColor" fill="none"/>
          <rect x="55" y="52" width="12" height="12" rx="2" stroke="currentColor" fill="none"/>
          <rect x="75" y="52" width="12" height="12" rx="2" stroke="currentColor" fill="none"/>
        </svg>
        <h3>No meetings booked yet</h3>
        <p>Go to the CRM section to book a meeting with a lead.</p>

  } else if (state.meetingsView === 'list') {
    html += renderMeetingsList(meetingLeads, now);

  }

  container.innerHTML = html;

function renderMeetingsList(leads, now) {
  const sorted = [...leads].sort((a, b) => {
    const aDate = a.crm.meetingDate ? new Date(a.crm.meetingDate) : new Date(9999, 0);
    const bDate = b.crm.meetingDate ? new Date(b.crm.meetingDate) : new Date(9999, 0);
    return aDate - bDate;
  });
  const upcoming = sorted.filter(l => l.crm.meetingDate && new Date(l.crm.meetingDate) >= now);
  const past = sorted.filter(l => l.crm.meetingDate && new Date(l.crm.meetingDate) < now);

  let html = '<div style="display:flex;flex-direction:column;gap:var(--space-4);">';

  if (upcoming.length) {
    html += '<h3 style="font-family:var(--font-display);font-weight:600;font-size:var(--text-sm);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;">Upcoming</h3>';
    upcoming.forEach(l => { html += renderMeetingCard(l, false); });
  }
  if (past.length) {
    html += '<h3 style="font-family:var(--font-display);font-weight:600;font-size:var(--text-sm);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:var(--space-4);">Past Meetings</h3>';
    past.forEach(l => { html += renderMeetingCard(l, true); });
  }
  html += '</div>';
  return html;
}

function renderMeetingsCalendar(meetingLeads) {
  const year = state.calendarYear;
  const month = state.calendarMonth;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDayOfWeek = firstDay.getDay();
  const totalDays = lastDay.getDate();

  const todayStr = today.toISOString().split('T')[0];

  // Meetings by date
  const meetingsByDate = {};
  meetingLeads.forEach(l => {
    if (l.crm.meetingDate) {
      const d = l.crm.meetingDate.split('T')[0];
      if (!meetingsByDate[d]) meetingsByDate[d] = [];
      meetingsByDate[d].push(l);
    }
  });

  let html = `
    <div class="calendar-nav">
      <button class="btn btn-ghost btn-sm" data-action="cal-prev" aria-label="Previous month"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <h3>${months[month]} ${year}</h3>
      <button class="btn btn-ghost btn-sm" data-action="cal-next" aria-label="Next month"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
    </div>
    <div class="calendar-grid">
  `;
  days.forEach(d => { html += `<div class="calendar-day-header">${d}</div>`; });

  // Previous month padding
  const prevMonthLastDay = new Date(year, month, 0).getDate();
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    html += `<div class="calendar-day other-month"><span class="day-number">${prevMonthLastDay - i}</span></div>`;
  }

  // Current month
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = dateStr === todayStr;
    const meetings = meetingsByDate[dateStr] || [];
    html += `
      <div class="calendar-day ${isToday ? 'today' : ''}" data-date="${dateStr}" style="position:relative;">
        <span class="day-number">${d}</span>
        ${meetings.map(m => `<span class="meeting-dot"></span><span class="meeting-name">${escapeHtml(m.businessName)}</span>`).join('')}
      </div>
    `;
  }

  // Next month padding
  const remaining = 42 - (startDayOfWeek + totalDays);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="calendar-day other-month"><span class="day-number">${i}</span></div>`;
  }

  html += '</div>';
  return html;
}

function renderArchive() {
  const container = document.getElementById('archive-content');
  const archived = state.leads.filter(l => l.status === 'archive');

  const followUpLeads = archived.filter(l => l.crm && (l.crm.disposition === 'follow_up' || l.crm.disposition === 'revisit'));
  const notInterestedLeads = archived.filter(l => l.crm && l.crm.disposition === 'not_interested');
  const archivedLeads = archived.filter(l => l.crm && l.crm.disposition === 'archived');

  const overdueLeads = archived.filter(l => l.crm && l.crm.followUpDate && daysUntil(l.crm.followUpDate) !== null && daysUntil(l.crm.followUpDate) < 0);

  let currentLeads;
  if (state.archiveTab === 'follow_up') currentLeads = followUpLeads;
  else if (state.archiveTab === 'not_interested') currentLeads = notInterestedLeads;
  else currentLeads = archivedLeads;

  let html = `
    <div class="section-header">
      <h1>Archive / Backlog</h1>
    </div>
  `;

  if (overdueLeads.length > 0) {
    html += `<div class="alert-banner" data-action="filter-overdue-archive"><i data-lucide="alert-triangle" aria-hidden="true"></i> ${overdueLeads.length} lead${overdueLeads.length > 1 ? 's have' : ' has'} overdue follow-up dates</div>`;
  }

  html += `
    <div class="pill-tabs">
      <button class="pill-tab ${state.archiveTab === 'follow_up' ? 'active' : ''}" data-action="archive-tab" data-tab="follow_up">Follow Up Later <span class="tab-badge">${followUpLeads.length}</span></button>
      <button class="pill-tab ${state.archiveTab === 'not_interested' ? 'active' : ''}" data-action="archive-tab" data-tab="not_interested">Not Interested <span class="tab-badge">${notInterestedLeads.length}</span></button>
      <button class="pill-tab ${state.archiveTab === 'archived' ? 'active' : ''}" data-action="archive-tab" data-tab="archived">Archived <span class="tab-badge">${archivedLeads.length}</span></button>
    </div>
  `;

  if (currentLeads.length === 0) {
    html += `
      <div class="empty-state">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M30 50 L60 30 L90 50 L90 90 L30 90 Z" stroke="currentColor" stroke-width="2" fill="none"/>
          <rect x="50" y="65" width="20" height="25" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
        <h3>Nothing here yet</h3>
        <p>Leads that are archived, not interested, or set for follow-up will appear here.</p>
      </div>
    `;
  } else {
    html += '<div class="lead-grid">';
    currentLeads.forEach(l => {
      const crm = l.crm || {};
      const fuDays = daysUntil(crm.followUpDate);
      let fuLabel = '';
      let fuClass = '';
      if (crm.followUpDate && fuDays !== null) {
        if (fuDays > 7) { fuLabel = `Follow up in ${fuDays} days`; fuClass = 'green'; }
        else if (fuDays > 0) { fuLabel = `Follow up in ${fuDays} days`; fuClass = 'orange'; }
        else if (fuDays === 0) { fuLabel = 'Follow up TODAY'; fuClass = 'warning'; }
        else { fuLabel = `Overdue by ${Math.abs(fuDays)} days`; fuClass = 'error'; }
      }
      const lastNote = crm.notes && crm.notes.length > 0 ? crm.notes[0] : null;
      const showDeleteConfirm = state.deleteConfirm[l.id];

      html += `
        <div class="card archive-card">
          <div class="lead-card-header">
            <div class="lead-card-name">${escapeHtml(l.businessName)}</div>
            <div style="display:flex;gap:var(--space-2);">
              ${l.industry ? `<span class="badge badge-neutral">${escapeHtml(l.industry)}</span>` : ''}
            </div>
          </div>
          <div class="archive-card-meta">
            <span class="badge ${getStageBadge(crm.stage || 1)}">${getStageName(crm.stage || 1)}</span>
            <span class="badge ${getDispositionBadge(crm.disposition)}">${getDispositionLabel(crm.disposition)}</span>
            ${crm.dateLastContact ? `<span style="color:var(--color-text-muted);">Last contact: ${formatDate(crm.dateLastContact)}</span>` : ''}
          </div>
          ${fuLabel ? `<div class="archive-follow-up ${fuClass}">${fuDays !== null && fuDays <= 0 ? '<i data-lucide="alert-triangle" style="width:12px;height:12px;display:inline;" aria-hidden="true"></i> ' : ''}${fuLabel}</div>` : ''}
          ${l.description ? `<p class="lead-card-desc" style="-webkit-line-clamp:1;">${escapeHtml(l.description)}</p>` : ''}
          ${lastNote ? `<p style="font-size:var(--text-xs);color:var(--color-text-faint);">${escapeHtml(lastNote.text).substring(0, 80)}${lastNote.text.length > 80 ? '...' : ''}</p>` : ''}
          ${renderAttribution(l)}
          ${renderLastActivity(l)}
          <div class="lead-card-actions">
            <button class="btn btn-primary btn-sm" data-action="reactivate" data-id="${l.id}"><i data-lucide="refresh-cw" aria-hidden="true"></i> Reactivate</button>
            <button class="btn btn-danger-ghost btn-sm" data-action="confirm-delete" data-id="${l.id}"><i data-lucide="trash-2" aria-hidden="true"></i> Delete</button>
          </div>
          ${showDeleteConfirm ? `
            <div class="confirm-delete">
              <span>Are you sure? This cannot be undone.</span>
              <button class="btn btn-danger-ghost btn-sm" data-action="delete-lead" data-id="${l.id}">Yes, delete</button>
              <button class="btn btn-ghost btn-sm" data-action="cancel-delete" data-id="${l.id}">Cancel</button>
            </div>
          ` : ''}
        </div>
      `;
    });
    html += '</div>';
  }

  container.innerHTML = html;
  lucide.createIcons({ nodes: [container] });
}

            <div class="accordion-content" id="acc-pb3-deck">
              <ul>
                <li><strong>Share a tab, not your screen.</strong> Use split view so you can see their reactions while presenting. Their face tells you more than their words.</li>
                <li><strong>The deck is a tool, not a script.</strong> Talk around the slides. Pause for their thoughts. Let the conversation flow naturally.</li>
                <li><strong>Go off-script when momentum builds.</strong> If they light up about something, dive deeper. The best conversations are the unplanned ones.</li>

              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-close1" aria-expanded="false">
              <span>Call 1: Close & Follow-up</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-close1">
              <ul>
                <li><strong>End with a clear next step:</strong> "Let's take a few days to digest this, then jump on a second call next week. I'll send over the slides and some tailored ideas."</li>
                <li><strong>Follow up within 2 hours with:</strong></li>
                <li>A summary of the key points discussed</li>
                <li>The deck (cleaned up if needed)</li>
                <li>A calendar link for Call 2</li>
                <li>3-5 tailored insights or examples specific to their business</li>

              <div class="playbook-callout">
                <i data-lucide="lightbulb" aria-hidden="true"></i>
                <span>The follow-up email is where deals are won or lost. Speed and quality both matter. Be the agency that follows up faster and better than anyone they've spoken to.</span>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-call2-open" aria-expanded="false">
              <span>Call 2: Re-establish & Set Tone</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-call2-open">
              <ul>
                <li><strong>Small talk first:</strong> Reference something they mentioned on Call 1. "How did that product launch go?" This shows you listened and you care.</li>
                <li><strong>Set the tone with confidence:</strong> "Since our last call, I've been thinking about how we can help specifically. I've gone back to the team and put together something bespoke for you."</li>
                <li><strong>Present like an expert, not a vendor:</strong> Paint the future. Don't just describe services — describe what their business looks like 6 months from now with you involved.</li>
              </ul>
            </div>
          </div>

          <div class="accordion-item">
            <button class="accordion-trigger" data-accordion="pb3-call2-close" aria-expanded="false">
              <span>Call 2: Structure & Close</span>
              <i data-lucide="chevron-down" class="acc-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="acc-pb3-call2-close">
              <p><strong>The presentation structure that closes:</strong></p>
              <ul>
                <li><strong>01 — Recap their problems:</strong> Mirror back what they told you. This proves you understood. "Last time we spoke, you mentioned X, Y, and Z..."</li>
                <li><strong>02 — Frame your solution:</strong> Position your approach as the answer to their specific challenges. Not generic services — specific solutions.</li>
                <li><strong>03 — Detail deliverables:</strong> What exactly will they get? Be concrete. Timelines, formats, outputs. Remove all ambiguity.</li>
                <li><strong>04 — Set expectations:</strong> Communication rhythm (weekly updates, Slack access), lead times, review cycles. They should leave knowing exactly what working together feels like.</li>

        </div>
      </div>

    </div>
  `;
  lucide.createIcons({ nodes: [container] });
}

document.getElementById('section-lead-bank').addEventListener('input', e => {

// CRM events
document.getElementById('section-crm').addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'generate-email') {
    const lead = getLeadById(id);
    if (lead) openModal('email', lead);
    return;
  } else if (action === 'crm-view') {
    state.crmView = target.dataset.view;
    saveState();
    renderCRM();
  } else if (action === 'cycle-priority') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const cycle = { high: 'medium', medium: 'low', low: 'high' };
      lead.crm.priority = cycle[lead.crm.priority];
      saveState();
      renderCRM();
    }
  } else if (action === 'follow-up-chip') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      lead.crm.followUpDate = daysFromNow(parseInt(target.dataset.days));
      saveState();
      renderCRM();
    }
  } else if (action === 'toggle-meeting') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      lead.crm.meetingBooked = !lead.crm.meetingBooked;
      if (lead.crm.meetingBooked && !lead.crm.meetingDate) {
        lead.crm.meetingDate = dateTimeFromNow(7, 10, 0);
      }
      saveState();
      renderCRM();
      renderSidebarBadges();
    }
  } else if (action === 'add-note') {
    const input = document.getElementById('note-input-' + id);
    if (input && input.value.trim()) {
      addNote(id, input.value.trim());
      renderCRM();
    }
  } else if (action === 'expand-notes') {
    state.expandedNotes[id] = true;
    renderCRM();
  } else if (action === 'collapse-notes') {
    state.expandedNotes[id] = false;
    renderCRM();
  } else if (action === 'archive-lead') {
    const disposition = target.dataset.disposition;
    const lead = getLeadById(id);
    // Prompt for loss reason for not_interested / archived (task 6)
    if (lead && (disposition === 'not_interested' || disposition === 'archived')) {
      openOutcomeReasonModal(id, disposition);
      return;
    }
    const row = document.getElementById('crm-row-' + id);
    if (row) row.classList.add('lead-archiving');
    setTimeout(() => {
      archiveLead(id, disposition);
      showToast('Lead moved to Archive', 'info');
      renderAll();
    }, 300);
  } else if (action === 'generate-brief') {
    const lead = getLeadById(id);
    if (lead) openBriefModal(lead);
  } else if (action === 'toggle-today-filter') {
    const scope = target.dataset.scope;
    if (scope === 'crm') {
      state.filters.crm.today = !state.filters.crm.today;
      saveState();
      renderCRM();
    } else if (scope === 'lead-bank') {
      state.filters.leadBank.today = !state.filters.leadBank.today;
      saveState();
      renderLeadBank();
    }
  } else if (action === 'bulk-clear') {
    state.bulkSelection = [];
    state.bulkScope = null;
    renderCRM();
  }
});
document.getElementById('section-crm').addEventListener('change', e => {
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  const f = e.target.dataset.filter;

  if (action === 'change-stage') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const newStageNum = parseInt(e.target.value);
      // Prompt for win reason when moving to Closed Won (stage 6)
      if (newStageNum === 6 && lead.crm.stage !== 6) {
        lead.crm.stage = 6;
        lead.crm.dateLastContact = todayISO;
        addActivity(lead, 'changed stage to Closed Won');
        saveState();
        openOutcomeReasonModal(id, 'won');
        renderCRM();
        renderSidebarBadges();
        return;
      }
      lead.crm.stage = newStageNum;
      lead.crm.dateLastContact = todayISO;
      addActivity(lead, 'changed stage to ' + getStageName(newStageNum));
      saveState();
      const row = document.getElementById('crm-row-' + id);
      if (row) row.classList.add('stage-updated');
      renderCRM();
      renderSidebarBadges();
    }
  } else if (action === 'change-disposition') {
    const lead = getLeadById(id);
    if (lead && lead.crm) {
      const newDisp = e.target.value;
      if (newDisp === 'not_interested' || newDisp === 'archived') {
        openOutcomeReasonModal(id, newDisp);
      } else {
        lead.crm.disposition = newDisp;
        saveState();
      }
    }
  } else if (action === 'change-first-contact') {
    updateCRM(id, { dateFirstContact: e.target.value });
  } else if (action === 'change-last-contact') {
    updateCRM(id, { dateLastContact: e.target.value });
  } else if (action === 'change-follow-up') {
    updateCRM(id, { followUpDate: e.target.value });
    renderCRM();
  } else if (action === 'change-meeting-date') {
    updateCRM(id, { meetingDate: e.target.value });
  } else if (action === 'change-meeting-notes') {
    updateCRM(id, { meetingNotes: e.target.value });
  } else if (action === 'change-pilot-start') {
    updateCRM(id, { pilotStartDate: e.target.value });
    // Auto-set pilot end to 28 days later if not yet set
    const lead = getLeadById(id);
    if (lead?.crm && e.target.value && !lead.crm.pilotEndDate) {
      const start = new Date(e.target.value);
      const end = new Date(start.getTime() + 28 * 86400000);
      updateCRM(id, { pilotEndDate: end.toISOString().split('T')[0] });
    }
    renderCRM();
  } else if (action === 'change-pilot-end') {
    updateCRM(id, { pilotEndDate: e.target.value });
  } else if (action === 'change-pilot-alerts') {
    const v = parseInt(e.target.value, 10);
    updateCRM(id, { pilotAlertCount: Number.isFinite(v) && v >= 0 ? v : 0 });
  } else if (action === 'change-deal-value') {
    const v = parseFloat(e.target.value);
    updateCRM(id, { dealValue: Number.isFinite(v) && v >= 0 ? v : 0 });
    renderCRM();
  } else if (action === 'bulk-toggle') {
    const scope = e.target.dataset.scope;
    state.bulkScope = scope;
    state.bulkSelection = state.bulkSelection || [];
    if (e.target.checked) {
      if (!state.bulkSelection.includes(id)) state.bulkSelection.push(id);
    } else {
      state.bulkSelection = state.bulkSelection.filter(x => x !== id);
    }
    if (scope === 'crm') renderCRM(); else renderLeadBank();
  } else if (action === 'bulk-action') {
    applyBulkAction(e.target.dataset.scope, e.target.value);
    e.target.value = '';
  }

  if (f === 'crm-search') { state.filters.crm.search = e.target.value; saveState(); renderCRM(); }
  if (f === 'crm-stage') { state.filters.crm.stage = e.target.value; saveState(); renderCRM(); }
  if (f === 'crm-priority') { state.filters.crm.priority = e.target.value; saveState(); renderCRM(); }
  if (f === 'crm-overdue') { state.filters.crm.overdueOnly = e.target.checked; saveState(); renderCRM(); }
  if (f === 'crm-assigned') { state.filters.crm.assignedTo = e.target.value; saveState(); renderCRM(); }
  if (f === 'crm-sort') { state.filters.crm.sort = e.target.value; saveState(); renderCRM(); }
  if (f === 'crm-show-all') { state.filters.crm.assignedTo = e.target.checked ? 'all' : getCurrentUser(); saveState(); renderCRM(); }

  // Research checklist
  if (action === 'research-check') {
    const lead = getLeadById(id);
    if (lead) {
      if (!lead.researchChecklist) lead.researchChecklist = [];
      const idx = parseInt(e.target.dataset.index);
      if (e.target.checked) { if (!lead.researchChecklist.includes(idx)) lead.researchChecklist.push(idx); }
      else { lead.researchChecklist = lead.researchChecklist.filter(i => i !== idx); }
      saveState();
    }
  }

  if (action === 'reassign-lead') {
    const lead = getLeadById(id);
    if (lead && canReassignLeads()) {
      lead.assignedTo = e.target.value;
      addActivity(lead, 'reassigned to ' + e.target.value);
      saveState();
      showToast('Lead reassigned to ' + e.target.value, 'info');
    }
  }
});
document.getElementById('section-crm').addEventListener('input', e => {
  const f = e.target.dataset.filter;
  if (f === 'crm-search') { state.filters.crm.search = e.target.value; saveState(); renderCRM(); }
});

document.getElementById('section-meetings').addEventListener('click', e => {

      saveState();
      showToast('Meeting marked as completed', 'success');
      renderAll();
    }
  } else if (action === 'reschedule-meeting') {

    if (lead && lead.crm) {
      // Simple: set to 1 week from now
      lead.crm.meetingDate = dateTimeFromNow(7, 10, 0);
      saveState();
      showToast('Meeting rescheduled', 'info');
      renderMeetings();
    }

    if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
    renderMeetings();

    state.calendarMonth++;
    if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
    renderMeetings();

document.getElementById('modal-overlay').addEventListener('click', e => {

  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'close-modal') closeModal();
  else if (action === 'copy-email') {
    const body = document.getElementById('email-body');
    if (body) { navigator.clipboard.writeText(body.textContent); showToast('Email copied', 'success'); }

// Focus trap for modal
document.getElementById('modal').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const modal = document.getElementById('modal');
  const focusable = modal.querySelectorAll('button, textarea, input, select, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

const AM_TEAM_MEMBERS = ['Ayoub Rasol', 'Melusi Ndoro', 'Joshua Khalili', 'Muneeb Moiz', 'Yousuf Zacky', 'Ameer Munj'];
const AM_ACTION_TYPES = [
  { value: 'all', label: 'All Actions' },
  { value: 'qualified', label: 'Qualified' },
  { value: 'moved to CRM', label: 'Moved to CRM' },
  { value: 'note', label: 'Note Added' },
  { value: 'stage', label: 'Stage Changed' },
  { value: 'archived', label: 'Archived' },
  { value: 'reactivated', label: 'Reactivated' }
];

function getAllActivities() {
  const activities = [];
  state.leads.forEach(lead => {
    if (!lead.activity) return;
    lead.activity.forEach(a => {
      activities.push({ ...a, leadName: lead.name, leadId: lead.id, leadStatus: lead.status });
    });
  });
  activities.sort((a, b) => new Date(b.date) - new Date(a.date));
  return activities;
}

function formatActivityTime(isoDate) {
  const d = new Date(isoDate);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const hours = d.getHours();
  const mins = d.getMinutes().toString().padStart(2, '0');
  const ampm = hours >= 12 ? 'pm' : 'am';
  const h12 = hours % 12 || 12;
  const timeStr = h12 + ':' + mins + ampm;
  if (isToday) return 'Today at ' + timeStr;
  if (isYesterday) return 'Yesterday at ' + timeStr;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' + timeStr;
}

function describeAction(action) {
  const a = action.toLowerCase();
  if (a.includes('qualified')) return 'qualified';
  if (a.includes('moved to crm') || a.includes('crm')) return 'moved to CRM';
  if (a.includes('note') || a.includes('added note')) return 'added a note';
  if (a.includes('stage')) return 'changed stage to ' + action.replace(/.*stage\s*(to\s*)?/i, '');
  if (a.includes('archived') || a.includes('archive')) return 'archived';
  if (a.includes('reactivated') || a.includes('reactivate')) return 'reactivated';
  return action;
}

function matchesActionFilter(action, filter) {
  if (filter === 'all') return true;
  const a = action.toLowerCase();
  switch (filter) {
    case 'qualified': return a.includes('qualified');
    case 'moved to CRM': return a.includes('moved to crm') || a.includes('crm');
    case 'note': return a.includes('note');
    case 'stage': return a.includes('stage');
    case 'archived': return a.includes('archived') || a.includes('archive');
    case 'reactivated': return a.includes('reactivated') || a.includes('reactivate');
    default: return true;
  }
}

function getActionBadgeClass(action) {
  const a = action.toLowerCase();
  if (a.includes('qualified')) return 'badge-teal';
  if (a.includes('crm')) return 'badge-blue';
  if (a.includes('note')) return 'badge-neutral';
  if (a.includes('stage')) return 'badge-purple';
  if (a.includes('archived') || a.includes('archive')) return 'badge-warning';
  if (a.includes('reactivated') || a.includes('reactivate')) return 'badge-success';
  return 'badge-neutral';
}

function navigateToLead(leadId) {

function renderActivityMonitor() {
  if (!isMasterUser()) return;
  const container = document.getElementById('activity-monitor-content');
  const allActivities = getAllActivities();

  // Read filter state
  const filterUser = state.amFilterUser || 'all';
  const filterAction = state.amFilterAction || 'all';
  const filterDate = state.amFilterDate || 'all';

  // Apply filters
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfToday);
  startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

  let filtered = allActivities.filter(a => {
    if (filterUser !== 'all' && a.by !== filterUser) return false;
    if (!matchesActionFilter(a.action, filterAction)) return false;
    if (filterDate === 'today' && new Date(a.date) < startOfToday) return false;
    if (filterDate === 'week' && new Date(a.date) < startOfWeek) return false;
    return true;
  });

  // Stats
  const totalActions = allActivities.length;
  const actionsToday = allActivities.filter(a => new Date(a.date) >= startOfToday).length;
  const userCounts = {};
  allActivities.forEach(a => { userCounts[a.by] = (userCounts[a.by] || 0) + 1; });
  const mostActive = Object.entries(userCounts).sort((a, b) => b[1] - a[1])[0];
  const mostActiveName = mostActive ? mostActive[0] : 'N/A';

  // Filtered user counts for breakdown
  const filteredUserCounts = {};
  filtered.forEach(a => { filteredUserCounts[a.by] = (filteredUserCounts[a.by] || 0) + 1; });
  const maxCount = Math.max(...Object.values(filteredUserCounts), 1);

  // Unique users from all activities
  const allUsers = [...new Set(allActivities.map(a => a.by))];

  // Build feed HTML (limit to 50 entries for performance)
  const feedEntries = filtered.slice(0, 50);
  let feedHTML = '';
  if (feedEntries.length === 0) {
    feedHTML = '<div class="am-empty">No activity matches your filters</div>';
  } else {
    feedEntries.forEach(a => {
      feedHTML += `
        <div class="am-feed-item">
          <div class="am-feed-time">${formatActivityTime(a.date)}</div>
          <div class="am-feed-body">
            <span class="am-feed-user">${escapeHtml(a.by)}</span>
            <span class="am-feed-action"> ${describeAction(a.action)} </span>
            <span class="badge ${getActionBadgeClass(a.action)}" style="margin-right:var(--space-2);">${describeAction(a.action)}</span>
            <span class="am-feed-lead" data-action="am-goto-lead" data-lead-id="${a.leadId}">${escapeHtml(a.leadName)}</span>
          </div>
        </div>`;
    });
  }

  // Build breakdown HTML
  let breakdownHTML = '';
  const breakdownUsers = AM_TEAM_MEMBERS.concat(allUsers.filter(u => !AM_TEAM_MEMBERS.includes(u) && u !== 'Unknown'));
  const uniqueBreakdownUsers = [...new Set(breakdownUsers)];
  uniqueBreakdownUsers.forEach(user => {
    const count = filteredUserCounts[user] || 0;
    const pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
    breakdownHTML += `
      <div class="am-user-row">
        <div class="am-user-name">${escapeHtml(user)}</div>
        <div class="am-user-bar-wrap"><div class="am-user-bar" style="width:${pct}%"></div></div>
        <div class="am-user-count">${count}</div>
      </div>`;
  });

  container.innerHTML = `
    <div class="section-header">
      <h1>Activity Monitor</h1>
    </div>
    <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-6);">Track all team activity across every lead in real time.</p>

    <div class="am-stats-bar">
      <div class="am-stat-card">
        <div class="am-stat-label">Total Actions</div>
        <div class="am-stat-value">${totalActions}</div>
      </div>
      <div class="am-stat-card">
        <div class="am-stat-label">Actions Today</div>
        <div class="am-stat-value">${actionsToday}</div>
      </div>
      <div class="am-stat-card">
        <div class="am-stat-label">Most Active User</div>
        <div class="am-stat-value">${escapeHtml(mostActiveName)}${mostActive ? '<span class="am-stat-value-sub">(' + mostActive[1] + ' actions)</span>' : ''}</div>
      </div>
    </div>

    <div class="am-filters">
      <div class="am-filter-group">
        <label>Team Member</label>
        <select id="am-filter-user">
          <option value="all"${filterUser === 'all' ? ' selected' : ''}>All Members</option>
          ${AM_TEAM_MEMBERS.map(n => `<option value="${n}"${filterUser === n ? ' selected' : ''}>${n}</option>`).join('')}
          ${allUsers.filter(u => !AM_TEAM_MEMBERS.includes(u) && u !== 'Unknown').map(n => `<option value="${n}"${filterUser === n ? ' selected' : ''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="am-filter-group">
        <label>Action Type</label>
        <select id="am-filter-action">
          ${AM_ACTION_TYPES.map(t => `<option value="${t.value}"${filterAction === t.value ? ' selected' : ''}>${t.label}</option>`).join('')}
        </select>
      </div>
      <div class="am-filter-group">
        <label>Date Range</label>
        <select id="am-filter-date">
          <option value="all"${filterDate === 'all' ? ' selected' : ''}>All Time</option>
          <option value="today"${filterDate === 'today' ? ' selected' : ''}>Today</option>
          <option value="week"${filterDate === 'week' ? ' selected' : ''}>This Week</option>
        </select>
      </div>

  lucide.createIcons();

function renderReports() {
  const container = document.getElementById('reports-content');
  const dateRange = state.reportRange || 'week';
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() + 1);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const startOfLastWeek = new Date(startOfWeek); startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);
  const endOfLastWeek = new Date(startOfWeek);

  let rangeStart = null;
  if (dateRange === 'week') rangeStart = startOfWeek;
  else if (dateRange === 'lastweek') { rangeStart = startOfLastWeek; }
  else if (dateRange === 'month') rangeStart = startOfMonth;
  const rangeEnd = dateRange === 'lastweek' ? endOfLastWeek : now;

  function countActions(user, actionMatch) {
    return state.leads.reduce((count, lead) => {
      if (!lead.activity) return count;
      return count + lead.activity.filter(a => {
        if (user && a.by !== user) return false;
        if (rangeStart && new Date(a.date) < rangeStart) return false;
        if (rangeEnd && new Date(a.date) > rangeEnd) return false;
        if (actionMatch && !a.action.includes(actionMatch)) return false;
        return true;
      }).length;
    }, 0);
  }
  function countFollowUpsDue(user) {
    return state.leads.filter(l => {
      if (l.status !== 'crm' || !l.crm || !l.crm.followUpDate) return false;
      if (user && l.assignedTo !== user) return false;
      const d = daysUntil(l.crm.followUpDate);
      return d !== null && d <= 7;
    }).length;
  }

  const currentUser = getCurrentUser();
  const users = isMasterUser() ? [...CONSULTANTS, ...CEOS] : [currentUser];

  function renderUserStats(user) {
    const calls = countActions(user, 'added lead') + countActions(user, 'changed stage');
    const emails = countActions(user, 'added note');
    const qualified = countActions(user, 'qualified');
    const movedCRM = countActions(user, 'moved to CRM');
    const meetings = state.leads.filter(l => l.crm && l.crm.meetingBooked && l.assignedTo === user).length;
    const followUps = countFollowUpsDue(user);
    return `
      <div class="report-user-card">
        <h3>${escapeHtml(user)}</h3>
        <div class="report-user-stat"><span>Calls / Outreach</span><strong>${calls}</strong></div>
        <div class="report-user-stat"><span>Notes Added</span><strong>${emails}</strong></div>
        <div class="report-user-stat"><span>Leads Qualified</span><strong>${qualified}</strong></div>
        <div class="report-user-stat"><span>Moved to CRM</span><strong>${movedCRM}</strong></div>
        <div class="report-user-stat"><span>Meetings Booked</span><strong>${meetings}</strong></div>
        <div class="report-user-stat"><span>Follow-ups Due (7d)</span><strong>${followUps}</strong></div>
      </div>
    `;
  }

  const rangeLabels = { week: 'This Week', lastweek: 'Last Week', month: 'This Month', all: 'All Time' };

  container.innerHTML = `
    <div class="section-header">
      <h1>Reports</h1>
    </div>
    <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-6);">Performance overview for your team.</p>

// ========== IMPORT LEGACY GAITGUARD LEADS ==========
// Maps the old GaitGuard CRM (crm.legacy.html) localStorage schema into the new lead model.
const LEGACY_STATUS_TO_STAGE = {
  'New': 1, 'Called': 2, 'No Answer': 3, 'Callback': 4, 'Email Me': 5,
  'Interested': 6, 'Visit Booked': 7, 'Trial': 8, 'Paying': 9, 'Rejected': 10
};
const LEGACY_CATEGORY_TO_YARDTYPE = {
  'Full Livery': 'full-livery', 'Part Livery': 'part-livery',
  'DIY': 'diy-livery', 'DIY Livery': 'diy-livery',
  'Livery Yard': 'full-livery', 'Livery': 'full-livery',
  'Training Yard': 'training-yard', 'Racing Yard': 'racing-yard',
  'Stud': 'stud', 'Stud Farm': 'stud',
  'Riding School': 'riding-school', 'Equestrian Centre': 'riding-school',
  'Private Owner': 'private-owner', 'Hunt': 'hunt', 'Polo': 'polo'
};
function migrateLegacyLead(l) {
  const stage = LEGACY_STATUS_TO_STAGE[l.status] || 1;
  const yardType = l._yardType || LEGACY_CATEGORY_TO_YARDTYPE[l.category] || (l.category ? 'other' : '');
  const businessName = (l.yard && l.yard.trim()) || l.name || 'Unnamed lead';
  const phones = l.phone ? [{ number: String(l.phone) }] : [];
  const emails = l.email ? [{ address: String(l.email) }] : [];
  const contacts = (l.name && l.name.trim() && l.name !== businessName)
    ? [{ name: l.name, title: l._decisionMakerRole || '', phone: l.phone || '', email: l.email || '' }]
    : [];
  const inCRM = stage > 1; // anything past "New" is already in pipeline
  const preQualified = !!l._qualified && !inCRM; // import-time pre-qualification flag
  const status = inCRM ? 'crm' : (preQualified ? 'qualified' : 'unqualified');
  const lead = {
    id: crypto.randomUUID(),
    businessName,
    industry: l._discipline || '',
    yardType,
    horseCount: l.horses || '',
    county: l.location || '',
    federations: l._federations || [],
    decisionMakerRole: l._decisionMakerRole || '',
    website: l.website || '',
    address: l._address || l.location || '',
    phones, emails, contacts,
    description: l._description || l.notes || '',
    source: l._source || 'manual',
    dateAdded: l.created || todayISO,
    status,
    qualifiedBy: preQualified ? 'system (import qualifier)' : undefined,
    qualification: (preQualified && l._preQualification) ? {
      yardOperation: l._preQualification.yardOperation || '',
      painPoint: l._preQualification.painPoint || '',
      budgetSignal: l._preQualification.budgetSignal || '',
      decisionMaker: l._preQualification.decisionMaker || '',
      pilotFit: l._preQualification.pilotFit || '',
      dateQualified: l.created || todayISO
    } : (l.notes ? {
      yardOperation: '', painPoint: '', budgetSignal: '', decisionMaker: '',
      pilotFit: l.notes, dateQualified: l.created || todayISO
    } : null),
    crm: inCRM ? {
      stage,
      disposition: stage === 10 ? 'not_interested' : 'nurture',
      priority: 'medium',
      dateFirstContact: l.lastContact || '',
      dateLastContact: l.lastContact || '',
      followUpDate: l.followUp || '',
      meetingBooked: stage >= 7,
      meetingDate: '',
      meetingNotes: '',
      notes: l.notes ? [{ text: l.notes, timestamp: new Date().toISOString() }] : [],
      dateMovedToCRM: l.created || todayISO,
      dealValue: 14400,
      pilotStartDate: stage === 8 ? (l.lastContact || todayISO) : '',
      pilotEndDate: '',
      pilotAlertCount: 0,
      outcomeReason: stage === 10 ? 'rejected' : ''
    } : null,
    assignedTo: 'Melusi Ndoro',
    activity: [{ user: 'system', action: preQualified ? 'imported & auto-qualified' : 'imported from legacy CRM', timestamp: new Date().toISOString() }]
  };
  // Strip undefined keys for clean storage
  Object.keys(lead).forEach(k => lead[k] === undefined && delete lead[k]);
  return lead;
}
function importLegacyLeads(rawJson) {
  let parsed;
  try {
    parsed = JSON.parse(rawJson);
  } catch (e) {
    showToast('Could not parse JSON — check the format', 'error');
    return 0;
  }
  if (!Array.isArray(parsed)) {
    showToast('Expected an array of leads', 'error');
    return 0;
  }
  const existing = new Set(state.leads.map(l => (l.businessName || '').toLowerCase().trim()));
  let added = 0, skipped = 0;
  parsed.forEach(legacy => {
    try {
      const lead = migrateLegacyLead(legacy);
      const key = (lead.businessName || '').toLowerCase().trim();
      if (key && existing.has(key)) { skipped++; return; }
      state.leads.unshift(lead);
      existing.add(key);
      added++;
    } catch (e) {
      console.warn('Skipped malformed legacy lead', legacy, e);
      skipped++;
    }
  });
  saveState();
  renderAll();
  showToast(`Imported ${added} leads (${skipped} skipped)`, added ? 'success' : 'info');
  return added;
}

  const area = document.getElementById('sidebar-import-area');

function csvEscape(val) {
  if (val === null || val === undefined) return '';
  const s = String(val);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportLeadsCSV() {
  const cols = ['Business Name','Industry','Website','Status','Stage','Assigned To','Deal Value','Date Added','Primary Contact','Phone','Email','Qualification Summary'];
  const rows = [cols.join(',')];
  state.leads.forEach(l => {
    const pc = getPrimaryContact(l) || {};
    const phone = (l.phones && l.phones[0]) || (pc.phone) || '';
    const email = (l.emails && l.emails[0]) || (pc.email) || '';
    const stageName = l.crm ? getStageName(l.crm.stage) : '';
    const dv = l.crm ? getDealValue(l) : '';
    const q = l.qualification
      ? [l.qualification.yardOperation, l.qualification.painPoint, l.qualification.budgetSignal, l.qualification.pilotFit].filter(Boolean).join(' | ')
      : '';
    rows.push([
      csvEscape(l.businessName),
      csvEscape(l.industry),
      csvEscape(l.website),
      csvEscape(l.status),
      csvEscape(stageName),
      csvEscape(l.assignedTo || ''),
      csvEscape(dv),
      csvEscape(l.dateAdded || ''),
      csvEscape(pc.name || ''),
      csvEscape(phone),
      csvEscape(email),
      csvEscape(q)
    ].join(','));
  });
  const csv = rows.join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const filename = `gaitguard-leads-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.csv`;
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported ' + state.leads.length + ' leads', 'success');
}

// ========== BULK ACTIONS ==========
function applyBulkAction(scope, value) {
  if (!value || !state.bulkSelection || state.bulkSelection.length === 0) return;
  const ids = [...state.bulkSelection];
  let n = 0;
  if (value.startsWith('reassign:')) {
    if (!canReassignLeads()) { showToast('Not allowed', 'error'); return; }
    const to = value.slice('reassign:'.length);
    ids.forEach(id => {
      const l = getLeadById(id);
      if (l) { l.assignedTo = to; addActivity(l, 'reassigned to ' + to); n++; }
    });
  } else if (value.startsWith('stage:')) {
    const s = parseInt(value.slice('stage:'.length));
    ids.forEach(id => {
      const l = getLeadById(id);
      if (l && l.crm) {
        l.crm.stage = s;
        l.crm.dateLastContact = todayISO;
        addActivity(l, 'changed stage to ' + getStageName(s));
        n++;
      }
    });
  } else if (value === 'archive') {
    ids.forEach(id => { archiveLead(id, 'archived'); n++; });
  } else if (value === 'delete') {
    if (!confirm('Delete ' + ids.length + ' leads? This cannot be undone.')) return;
    ids.forEach(id => { deleteLead(id); n++; });
  }
  saveState();
  state.bulkSelection = [];
  state.bulkScope = null;
  showToast(n + ' leads updated', 'success');
  renderAll();
}

// ========== MEETING BRIEF ==========
function pickFounderForLead(lead) {
  // GaitGuard is a one-person operation; everything routes to Melusi until SDRs are hired.
  return 'Melusi Ndoro';
}
function getPrimaryGap(lead) {
  const w = (lead.qualification && lead.qualification.painPoint) || '';
  const first = w.split('\n')[0].replace(/^[-*\s]+/, '').trim();
  return first || 'Not yet identified — probe for the single biggest welfare or anxiety pain point in the first 10 minutes.';
}
function getRecommendedAngle(lead) {
  // Pick the dominant qualification signal and tailor the opener accordingly.
  const q = lead.qualification || {};
  const sigs = {
    pain: (q.painPoint || '').length,
    operation: (q.yardOperation || '').length,
    budget: (q.budgetSignal || '').length
  };
  const dominant = Object.entries(sigs).sort((a, b) => b[1] - a[1])[0][0];
  const mapping = {
    pain: "Lead with the welfare angle. Open by referencing the specific concern they raised — lameness scare, anxious owner, theft, vet bill — and frame the camera as continuous monitoring that catches it earlier than a trot-up.",
    operation: "Lead with the yard's operation. Reference what they actually run — number of horses, walker, racing string — and explain how GaitGuard sits at the walker without changing their routine.",
    budget: "Lead with ROI. Reference the cost of one missed lameness flag (vet workup, lost competition season, pre-purchase exam fail) versus a free 4-week pilot. Make the maths obvious."
  };
  return mapping[dominant] || mapping.pain;
}
function getOpeningQuestions(lead) {
  const industry = (lead.industry || '').toLowerCase();
  const q = lead.qualification || {};
  const base = [
    "What's the one thing about how you're growing right now that keeps you up at night?",
    "If we could fix one thing about how customers find you or buy from you, what would it be?",
    "Who inside your business actually owns this problem — and what have they tried already?"
  ];
  if (/restaurant|food|bakery|coffee/.test(industry)) base[0] = "Walk me through a typical Friday night — where does the operation feel tightest?";
  if (/ecommerce|shop|retail/.test(industry)) base[0] = "Where in the funnel are you losing the most — traffic, conversion, or repeat?";
  return base;
}
function getRedFlags(lead) {
  const flags = [];
  const notes = (lead.crm && lead.crm.notes || []).map(n => (n.text || '').toLowerCase()).join(' ');
  const q = lead.qualification || {};
  if (/budget|cheap|price|cost/i.test(notes)) flags.push("Price-sensitive signals in notes — anchor value early.");
  if (/agency|consultant|already/i.test(notes)) flags.push("Mentioned existing agency relationship — understand what's working and what's not before positioning us.");
  if (!q.decisionMaker || q.decisionMaker.trim().length < 20) flags.push("Growth intent is thin — probe for urgency and specific targets.");
  if (!lead.crm || !lead.crm.dateFirstContact) flags.push("No prior contact recorded — verify the meeting booking is real before the call.");
  return flags;
}
function buildBriefText(lead) {
  const pc = getPrimaryContact(lead) || {};
  const founder = pickFounderForLead(lead);
  const q = lead.qualification || {};
  const gap = getPrimaryGap(lead);
  const angle = getRecommendedAngle(lead);
  const openers = getOpeningQuestions(lead);
  const redFlags = getRedFlags(lead);
  const recent = (lead.activity || []).slice(0, 5).map(a => `- ${a.by} ${a.action} (${formatTimeAgo(a.date)})`).join('\n') || '- No recent activity logged';
  const meetingLine = lead.crm && lead.crm.meetingDate ? formatDateTime(lead.crm.meetingDate) : 'Not yet scheduled';

  return `MEETING BRIEF — ${lead.businessName}
${lead.industry ? 'Industry: ' + lead.industry : ''}

CONTACT
${pc.name || '—'}${pc.title ? ', ' + pc.title : ''}
${pc.email || ''} ${pc.phone || ''}

MEETING
${meetingLine}
Assigned to: ${founder}

PRIMARY GAP
${gap}

QUALIFICATION SUMMARY
Yard & Operation: ${q.yardOperation || '—'}
Pain Point: ${q.painPoint || '—'}
Budget Signal: ${q.budgetSignal || '—'}
Pilot Fit: ${q.pilotFit || '—'}
Decision Maker: ${q.decisionMaker || '—'}

RECENT ACTIVITY
${recent}

RECOMMENDED ANGLE
${angle}

OPENING QUESTIONS
1. ${openers[0]}
2. ${openers[1]}
3. ${openers[2]}

RED FLAGS
${redFlags.length ? redFlags.map(f => '- ' + f).join('\n') : '- None flagged. Proceed with confidence.'}
`;
}

    } else {
      // mode is 'not_interested' or 'archived' — archive the lead
      addActivity(lead, 'archived (' + mode + ', reason: ' + reason + ')');
      archiveLead(leadId, mode);
      showToast('Lead moved to Archive', 'info');
    }
    closeModal();
    renderAll();
  });
}

// ========== DUPLICATE DETECTION ==========
function normaliseBusinessName(name) {
  return String(name || '')
    .toLowerCase()
    .replace(/\b(ltd|limited|inc|llc|co|company|the|and|&)\b/g, '')
    .replace(/[^a-z0-9]+/g, '')
    .trim();
}
function findSimilarLeads(name) {
  const norm = normaliseBusinessName(name);
  if (norm.length < 3) return [];
  return state.leads.filter(l => {
    const ln = normaliseBusinessName(l.businessName);
    if (!ln) return false;
    return ln === norm || ln.includes(norm) || norm.includes(ln);
  });
}

let chatHistory = [];
let chatLearnings = [];
let chatActiveView = 'chat';

function loadChatState() {
  try {
    const h = localStorage.getItem('gaitguard-chat-history');
    if (h) chatHistory = JSON.parse(h);
    const l = localStorage.getItem('gaitguard-learnings');
    if (l) chatLearnings = JSON.parse(l);
  } catch(e) {}
}
function saveChatState() {
  try {
    localStorage.setItem('gaitguard-chat-history', JSON.stringify(chatHistory));
    localStorage.setItem('gaitguard-learnings', JSON.stringify(chatLearnings));
  } catch(e) {}
}
const DEFAULT_GEMINI_KEY = 'AIzaSyCU9lnXe4Hne3J8tjSEo_X3WuNc-Sfws1s';
function getApiKey() {
  // Prefer user-stored key, fall back to legacy, then to the embedded default so the chatbot works out of the box.
  return localStorage.getItem('gaitguard-gemini-key') || localStorage.getItem('gaitguard-api-key') || DEFAULT_GEMINI_KEY;
}
function setApiKey(key) { localStorage.setItem('gaitguard-gemini-key', key); }

function renderChatMessages() {
  const container = document.getElementById('chat-messages');
  if (chatHistory.length === 0) {
    container.innerHTML = '<div class="chat-msg system">Ask GaitGuard Assistant anything about leads, outreach, objections, pricing, or strategy.</div>';
    return;
  }
  container.innerHTML = chatHistory.filter(m => m.role !== 'system').map(m => {
    return `<div class="chat-msg ${m.role === 'user' ? 'user' : 'ai'}">${escapeHtml(m.content).replace(/\n/g, '<br>')}</div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function renderChatLearnings() {
  const container = document.getElementById('chat-view-learnings');
  if (chatLearnings.length === 0) {
    container.innerHTML = '<div style="padding:var(--space-4);color:var(--color-text-muted);font-size:var(--text-sm);text-align:center;">No learnings captured yet. The AI will tag insights with [LEARNING]: during conversations.</div>';
    return;
  }
  container.innerHTML = (isMasterUser() ? '<div style="text-align:right;margin-bottom:var(--space-3);"><button class="btn btn-danger-ghost btn-sm" id="clear-learnings">Clear All</button></div>' : '') +
    chatLearnings.map((l, i) => `<div class="chat-learning-item">${escapeHtml(l)}</div>`).join('');
  if (isMasterUser()) {
    const clearBtn = document.getElementById('clear-learnings');
    if (clearBtn) clearBtn.addEventListener('click', () => { chatLearnings = []; saveChatState(); renderChatLearnings(); });
  }

function switchChatView(view) {
  chatActiveView = view;
  ['chat', 'settings', 'learnings'].forEach(v => {
    document.getElementById('chat-view-' + v).style.display = v === view ? (v === 'chat' ? 'flex' : 'block') : 'none';
    document.getElementById('chat-tab-' + v).classList.toggle('active', v === view);
  });
  if (view === 'chat') renderChatMessages();
  if (view === 'learnings') renderChatLearnings();
  if (view === 'settings') document.getElementById('chat-api-key').value = getApiKey();
}

function getLeadContext() {
  // If user is viewing CRM, try to detect the lead in focus
  if (state.activeSection === 'crm') {
    const crmLeads = state.leads.filter(l => l.status === 'crm');
    if (crmLeads.length === 1) return crmLeads[0];
  }
  return null;
}

async function sendChatMessage(text) {
  if (!text.trim()) return;
  const apiKey = getApiKey();
  if (!apiKey) { switchChatView('settings'); return; }

  chatHistory.push({ role: 'user', content: text });
  renderChatMessages();

  // Show typing indicator
  const msgArea = document.getElementById('chat-messages');
  const typing = document.createElement('div');
  typing.className = 'chat-typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  msgArea.appendChild(typing);
  msgArea.scrollTop = msgArea.scrollHeight;

  // Build messages
  let systemMsg = CHAT_SYSTEM_PROMPT;
  if (chatLearnings.length > 0) {
    systemMsg += '\n\nPrevious learnings from the team:\n' + chatLearnings.map((l, i) => `${i+1}. ${l}`).join('\n');
  }
  const leadCtx = getLeadContext();
  let contextMsg = '';
  if (leadCtx) {
    contextMsg = '\n\n[Current lead in view: ' + JSON.stringify({
      businessName: leadCtx.businessName, industry: leadCtx.industry, website: leadCtx.website,
      qualification: leadCtx.qualification, crm: leadCtx.crm ? { stage: getStageName(leadCtx.crm.stage), disposition: leadCtx.crm.disposition, priority: leadCtx.crm.priority } : null
    }) + ']';
  }

  // Gemini expects role: 'user' | 'model', system prompt goes in systemInstruction,
  // and the message array carries the turn history. The latest user message is already
  // the last entry in chatHistory (we pushed it above), so we include the full history.
  const contents = chatHistory.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));

  // Append the lead context to the final user message (so it stays with that turn).
  if (contextMsg && contents.length > 0) {
    const last = contents[contents.length - 1];
    last.parts[0].text = last.parts[0].text + contextMsg;
  }

  try {
    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: systemMsg }] },
        generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
      })
    });
    typing.remove();
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      const errMsg = err.error?.message || 'API error (' + resp.status + ')';
      chatHistory.push({ role: 'assistant', content: 'Error: ' + errMsg });
    } else {
      const data = await resp.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
      chatHistory.push({ role: 'assistant', content: reply });

      // Check for learnings
      const learningMatch = reply.match(/\[LEARNING\]:\s*(.*?)(?:\n|$)/gi);
      if (learningMatch) {
        learningMatch.forEach(m => {
          const text = m.replace(/\[LEARNING\]:\s*/i, '').trim();
          if (text) chatLearnings.push(text);
        });
      }
    }
  } catch (e) {
    typing.remove();
    chatHistory.push({ role: 'assistant', content: 'Connection error: ' + e.message });
  }
  saveChatState();
  renderChatMessages();
}

async function testGeminiConnection() {
  const resultEl = document.getElementById('chat-test-result');
  const apiKey = document.getElementById('chat-api-key').value.trim() || getApiKey();
  if (!apiKey) {
    resultEl.textContent = 'Enter a key first.';
    resultEl.style.color = 'var(--color-danger, #c0392b)';
    return;
  }
  resultEl.textContent = 'Testing...';
  resultEl.style.color = 'var(--color-text-muted)';
  try {
    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: 'Reply with the single word: ok' }] }],
        generationConfig: { temperature: 0, maxOutputTokens: 10 }
      })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      resultEl.textContent = 'Failed: ' + (err.error?.message || 'HTTP ' + resp.status);
      resultEl.style.color = 'var(--color-danger, #c0392b)';
      return;
    }
    const data = await resp.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (reply) {
      resultEl.textContent = 'Success — Gemini responded.';
      resultEl.style.color = 'var(--color-success, #1a7f37)';
    } else {
      resultEl.textContent = 'Unexpected response shape.';
      resultEl.style.color = 'var(--color-danger, #c0392b)';
    }
  } catch (e) {
    resultEl.textContent = 'Connection error: ' + e.message;
    resultEl.style.color = 'var(--color-danger, #c0392b)';
  }
}

// ========== INIT ==========
function init() {
  console.info('[GaitGuard] init() — state.leads has', state.leads?.length ?? 'undefined', 'entries on entry');
  try {
    // Check if user is already logged in
    if (isLoggedIn()) {
      const user = getCurrentUser();
      const disp = document.getElementById('current-user-display');
      if (disp) disp.textContent = user;
      hideLoginOverlay();
    }
    updateMasterUI();
    renderResetButton();
    renderExportButton();
    renderImportButton();
    applyConsultantDefaults();
    try { loadChatState(); } catch (e) { console.warn('loadChatState failed:', e); }
    // Ensure home is the default section on first login unless user has a saved pref
    if (!state.activeSection) state.activeSection = 'home';
    // Reflect persisted activeSection into UI
    try { showSection(state.activeSection); } catch (e) {
      console.error('showSection failed, falling back to badge render only:', e);
      try { renderSidebarBadges(); } catch (_) {}
    }
    try { lucide.createIcons(); } catch (e) { console.warn('lucide.createIcons failed (CDN may be down):', e); }
    // Boot shared-backend sync (safe no-op if Firebase isn't configured).
    try { startSharedSync(); } catch (e) { console.warn('startSharedSync failed:', e); }
  } catch (e) {
    console.error('[GaitGuard] init() crashed:', e);
    // Best-effort: still try to render badges so user sees their data
    try { renderSidebarBadges(); } catch (_) {}
  }
}
window.addEventListener('error', e => console.error('[GaitGuard window error]', e.message, 'at', e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => console.error('[GaitGuard unhandled rejection]', e.reason));

// Initialize Firestore sync + merge remote leads into local state, live.
async function startSharedSync() {
  try {
    const ok = await GaitGuardSync.init();
    if (!ok) {
      GaitGuardSync.showSyncStatus('offline');
      return;
    }
    GaitGuardSync.subscribe(remoteLeads => {
      // Defensive: don't let an empty/error snapshot wipe local data
      if (!Array.isArray(remoteLeads)) return;
      if (remoteLeads.length === 0 && Array.isArray(state.leads) && state.leads.length > 0) {
        console.warn('[GaitGuardSync] Ignoring empty remote snapshot — keeping local', state.leads.length, 'leads.');
        return;
      }
      state.leads = remoteLeads;
      try { localStorage.setItem('gaitguard-leads-v2', JSON.stringify(state.leads)); } catch (_) {}
      if (typeof renderAll === 'function') renderAll();
    });
    // First-time seed-push: if we already had local leads but nothing in the cloud yet,
    // kick a push so the Master immediately sees what's local.
    if (Array.isArray(state.leads) && state.leads.length > 0) {
      GaitGuardSync.pushLeads(state.leads);
    }
  } catch (e) {
    console.warn('startSharedSync failed', e);
  }
}
document.addEventListener('DOMContentLoaded', init);
